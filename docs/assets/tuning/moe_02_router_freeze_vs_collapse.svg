  <g id="flame-col-router">
    <rect x="222" y="57" width="18" height="18" rx="9" fill="#FFFFFF" stroke="#000000" stroke-width="0" id="flame-col-router-bg"/>
    <path d="M 231 58.8 C 231.4 61.6 234.8 62.8 234.8 66.6 C 234.8 69.4 232.9 71.4 230.6 71.4 C 228.1 71.4 226.4 69.5 226.4 66.9 C 226.4 65 227.5 63.4 228.6 62.4 C 228.4 63.9 229.2 64.8 230 64.9 C 229.5 62.8 230 60.5 231 58.8 Z" fill="#B83232" id="flame-col-router-icon"/>
    <rect x="228.3" y="65.8" width="5" height="5" rx="2.5" fill="#F4DEC1" stroke="#000000" stroke-width="0" id="flame-col-router-core"/>
