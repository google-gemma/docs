  <g id="arrows" fill="none">
    <g id="a-col">
      <path d="M 177 102 L 177 113.8" stroke="#000000" stroke-width="1.6" stroke-linejoin="miter"/>
      <polygon points="177,121 172.38,113 181.62,113" fill="#000000"/>
