          <text font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#000000" text-anchor="middle" id="router-contrast-left-sub"><tspan x="177" y="51">(collapses onto a few experts)</tspan></text>
        </g>
