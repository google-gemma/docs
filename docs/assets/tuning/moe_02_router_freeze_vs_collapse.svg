    <g id="a-frz">
      <path d="M 544.5 102 L 544.5 113.8" stroke="#000000" stroke-width="1.6" stroke-linejoin="miter"/>
      <polygon points="544.5,121 539.88,113 549.12,113" fill="#000000"/>
