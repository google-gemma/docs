{% extends "main.html" %}

{% block container %}
<div class="gemma-bg">
  <svg class="gemma-wave-svg" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="gemmaWaveGrad1" x1="0%" y1="0%" x2="100%" y2="50%">
        <stop offset="0%" stop-color="var(--gemma-blue)" stop-opacity="0.55" />
        <stop offset="50%" stop-color="var(--gemma-blue-light)" stop-opacity="0.75" />
        <stop offset="100%" stop-color="var(--gemma-blue-deep)" stop-opacity="0.15" />
      </linearGradient>
      <linearGradient id="gemmaWaveGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#64B5F6" stop-opacity="0.5" />
        <stop offset="50%" stop-color="var(--gemma-blue)" stop-opacity="0.65" />
        <stop offset="100%" stop-color="#0e244b" stop-opacity="0.2" />
      </linearGradient>
      <linearGradient id="gemmaCoreGlow" x1="0%" y1="50%" x2="100%" y2="50%">
        <stop offset="0%" stop-color="var(--gemma-blue)" stop-opacity="0" />
        <stop offset="45%" stop-color="var(--gemma-blue-light)" stop-opacity="0.45" />
        <stop offset="55%" stop-color="#64B5F6" stop-opacity="0.6" />
        <stop offset="100%" stop-color="var(--gemma-blue-deep)" stop-opacity="0" />
      </linearGradient>
      <filter id="waveBlurLow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" />
      </filter>
      <filter id="waveBlurHigh" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="24" />
      </filter>
      <filter id="coreBloom" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="45" />
      </filter>
    </defs>

    <ellipse cx="720" cy="650" rx="660" ry="150" fill="url(#gemmaCoreGlow)" filter="url(#coreBloom)" opacity="0.75" />
    <ellipse cx="680" cy="670" rx="380" ry="85" fill="#1D53D4" filter="url(#coreBloom)" opacity="0.25" />

    <path d="M-100 690 C 300 500, 520 790, 850 580 C 1120 420, 1350 650, 1580 550 L 1580 950 L -100 950 Z" fill="url(#gemmaWaveGrad1)" filter="url(#waveBlurHigh)" opacity="0.45" />
    <path d="M-100 660 C 250 460, 480 730, 780 570 C 1080 400, 1320 620, 1580 520 L 1580 950 L -100 950 Z" fill="url(#gemmaWaveGrad2)" filter="url(#waveBlurLow)" opacity="0.55" />
    <path d="M-100 660 C 250 460, 480 730, 780 570 C 1080 400, 1320 620, 1580 520" stroke="#64B5F6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" filter="url(#waveBlurLow)" />
    <path d="M-100 660 C 250 460, 480 730, 780 570 C 1080 400, 1320 620, 1580 520" stroke="var(--gemma-white)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.65" />
    <path d="M-100 720 C 220 640, 490 500, 760 600 C 1030 700, 1280 490, 1580 590" stroke="var(--gemma-blue-light)" stroke-width="2.5" fill="none" opacity="0.6" filter="url(#waveBlurLow)" />
    <path d="M-100 720 C 220 640, 490 500, 760 600 C 1030 700, 1280 490, 1580 590" stroke="#90CAF9" stroke-width="1" fill="none" opacity="0.5" />
    <path d="M-50 570 C 350 680, 600 470, 900 640 C 1180 800, 1380 560, 1600 660" stroke="var(--gemma-blue)" stroke-width="2" fill="none" opacity="0.45" filter="url(#waveBlurLow)" />
  </svg>
</div>

<div class="gemma-teaser">
  <div class="gemma-name" aria-label="Gemma model family">
    <div class="gemma-prefix-slot">
      <span class="gemma-cycling" id="gemma-prefix"></span>
    </div>
    <span class="gemma-static">Gemma</span>
    <div class="gemma-suffix-slot">
      <span class="gemma-cycling" id="gemma-suffix"></span>
    </div>
  </div>

  <p class="gemma-tagline">Our most capable open models</p>

  <div class="gemma-actions">
    <a class="gemma-btn" href="get-started/">Get Started</a>
    <a class="gemma-btn gemma-btn--ghost" href="models/">Model Overview</a>
  </div>
</div>

<script>
  (function () {
    var variants = [
      { prefix: '', suffix: '\u00a04' },
      { prefix: 'Pali', suffix: '' },
      { prefix: '', suffix: '\u00a03n' },
      { prefix: 'Diffusion', suffix: '' },
      { prefix: '', suffix: '\u00a03' },
      { prefix: 'Code', suffix: '' },
      { prefix: 'Shield', suffix: '' },
      { prefix: 'Embedding', suffix: '' },
      { prefix: '', suffix: '\u00a02' },
      { prefix: 'Function', suffix: '' },
      { prefix: 'Data', suffix: '' },
      { prefix: 'Recurrent', suffix: '' },
    ];

    var index = 0;
    var prefixEl = document.getElementById('gemma-prefix');
    var suffixEl = document.getElementById('gemma-suffix');

    if (!prefixEl || !suffixEl) return;

    prefixEl.textContent = variants[0].prefix;
    suffixEl.textContent = variants[0].suffix;
    prefixEl.style.transform = 'translateY(0)';
    prefixEl.style.opacity = '1';
    suffixEl.style.transform = 'translateY(0)';
    suffixEl.style.opacity = '1';

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var duration = 3000;
    var animation = 400;
    var easing = 'cubic-bezier(0.4, 0, 0.2, 1)';

    var intervalId = setInterval(function () {
      if (!document.body.contains(prefixEl)) {
        clearInterval(intervalId);
        return;
      }

      prefixEl.style.transition = 'transform ' + animation + 'ms ' + easing + ', opacity ' + animation + 'ms ease';
      suffixEl.style.transition = 'transform ' + animation + 'ms ' + easing + ', opacity ' + animation + 'ms ease';
      prefixEl.style.transform = 'translateY(-120%)';
      prefixEl.style.opacity = '0';
      suffixEl.style.transform = 'translateY(-120%)';
      suffixEl.style.opacity = '0';

      setTimeout(function () {
        index = (index + 1) % variants.length;
        prefixEl.textContent = variants[index].prefix;
        suffixEl.textContent = variants[index].suffix;
        prefixEl.style.transition = 'none';
        suffixEl.style.transition = 'none';
        prefixEl.style.transform = 'translateY(120%)';
        prefixEl.style.opacity = '0';
        suffixEl.style.transform = 'translateY(120%)';
        suffixEl.style.opacity = '0';

        void prefixEl.offsetHeight;

        requestAnimationFrame(function () {
          prefixEl.style.transition = 'transform ' + animation + 'ms ' + easing + ', opacity ' + animation + 'ms ease';
          suffixEl.style.transition = 'transform ' + animation + 'ms ' + easing + ', opacity ' + animation + 'ms ease';
          prefixEl.style.transform = 'translateY(0)';
          prefixEl.style.opacity = '1';
          suffixEl.style.transform = 'translateY(0)';
          suffixEl.style.opacity = '1';
        });
      }, animation + 30);
    }, duration);
  })();
</script>
{% endblock %}
