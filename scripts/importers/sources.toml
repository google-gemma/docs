# Upstream source for every ported page.
#
# Consumed by `scripts/importers/port_docs.py` and `check_fidelity.py`, and the origin of the
# `source_url` frontmatter added in PLAN.md Step 3.1.
#
#   frozen = true  -> HAND-MAINTAINED. Never re-convert; the file on disk is the source of
#                     truth. port_docs.py skips it and check_fidelity.py ignores it, because
#                     divergence from upstream is intended. The `source` line is kept purely
#                     for provenance. All of models/** and get-started/** are frozen as of
#                     2026-08-03 -- see "Hand-maintained sections" in PLAN.md.
#   (no frozen)    -> a straight port; the converter may rewrite it freely.
#
# Set `frozen = true` as soon as anyone starts hand-editing a page.
#
# Deliberately absent entirely (never ported from upstream):
#   models/index.md          hand-authored hub page
#   cookbook.md, index.md    authored for this site
#
# `assets` is the subdirectory under docs/assets/ that inline base64 images are extracted to.

