# ------------------------------------------------------------------------------------------
# [anchors] Fragments whose section exists but under a different slug than devsite used.
# `--fix-anchors` handles the common underscore -> hyphen case automatically; these are the
# ones where the heading text itself differs, so a heuristic would risk linking to the wrong
# section. Key is "<target page>#<upstream fragment>", value is the correct slug.
#
# NOT listed here (deliberately): anchors that are broken upstream too. `#harm-types` on
# shieldgemma/model-card-v2.md and `#categories` on paligemma/index.md point at sections that
# do not exist on ai.google.dev either. Inventing a target would be an editorial guess; see
# PLAN.md Notes.
# ------------------------------------------------------------------------------------------
# ------------------------------------------------------------------------------------------
# [page_overrides] Per-page mapping that beats [ported] for that page only.
#
# The Gemma 1/2/3 cards open with "**Model Page** : [Gemma](/gemma/docs/core)". Upstream that
# meant "the current Gemma page", but here /core resolves to Gemma 4 -- so the Gemma 2 card
# would advertise Gemma 4 as its model page. Each card points at itself instead.
# ------------------------------------------------------------------------------------------
[page_overrides."models/gemma-1/index.md"]
"/core" = "models/gemma-1/index.md"

[page_overrides."models/gemma-2/index.md"]
"/core" = "models/gemma-2/index.md"

[page_overrides."models/gemma-3/index.md"]
"/core" = "models/gemma-3/index.md"

