# Engines, libraries and runtimes the docs show code for -- the single source of truth.
#
# Consumed by:
#   - Frontmatter validation  (scripts/frontmatter_schema.py, the `frameworks` key)
#   - The page context strip  (overrides/partials/model-names.html, generated)
#
# A controlled vocabulary on purpose: "transformers" vs "huggingface" vs "hf" spread across 89
# pages would be unusable. Add an entry here before using it in a page -- the linter rejects
# anything not listed, which is the point.
#
# This list holds only what is in use. It is not a catalogue of everything that can run Gemma.
#
#   id    what frontmatter uses. Lowercase, kebab-case.
#   pinned  the model generation this entry's `url` is hard-coded to. Set it whenever the URL
#         embeds a version -- .../gemma-4-31b-it -- so `lint_docs.py --check pinned` can list
#         every link that needs revisiting when a new generation ships. Omit for stable URLs.
#   name  the canonical display name.
#   short_name  optional compact label for dense UI such as the page context strip.
#   url   the project's own home. Where one was already linked from a docs page, that URL is
#         reused verbatim; the four marked `unverified` were not found anywhere in docs/ and
#         should be confirmed before anyone relies on them.
#   page  our page for it, where we have one. Entries without one are hosted endpoints: the
#         grid links straight out to `url`.
#
# There is deliberately no `category`. The previous version had one and it was incoherent:
# `local`/`serve` classify where something runs while `library`/`tuning`/`orchestration`
# classify what kind of software it is, so `transformers` and `llamacpp` -- both libraries,
# both usually local -- landed in different groups for no reason a reader could follow.

frameworks:
  - id: ollama
    name: Ollama
    url: https://ollama.com
    page: deployment/ollama.md
    blurb: One command to pull and chat, locally.
    mark: Ol

  - id: llamacpp
    name: llama.cpp
    url: https://github.com/ggml-org/llama.cpp
    page: deployment/llamacpp.md
    blurb: Fast GGUF inference on CPU and Apple silicon.
    mark: lc

  - id: lmstudio
    name: LM Studio
    url: https://lmstudio.ai
    page: deployment/lmstudio.md
    blurb: Desktop chat app, no coding required.
    mark: LM

  - id: mlx
    name: MLX
    url: https://github.com/ml-explore/mlx
    page: deployment/mlx.md
    blurb: Native Apple silicon, no conversion step.
    mark: MLX

  - id: litert
    name: LiteRT
    url: https://ai.google.dev/edge/litert
    page: deployment/litert.md
    blurb: On-device inference with CPU, GPU and NPU support.
    mark: Li

  - id: webgpu
    name: WebGPU
    url: https://www.w3.org/TR/webgpu/     # unverified
    page: deployment/web.md

  - id: vllm
    name: vLLM
    url: https://docs.vllm.ai
    page: deployment/vllm.md
    blurb: High-throughput serving with an OpenAI-compatible API.
    mark: vL

  - id: sglang
    name: SGLang
    url: https://docs.sglang.io
    page: deployment/sglang.md
    blurb: High-performance serving for text and multimodal.
    mark: SG

  - id: gemini-api
    name: Gemini API
    short_name: Gemini API
    url: https://ai.google.dev/gemini-api/docs
    page: deployment/gemini-api.md
    blurb: Hosted Gemma, no infrastructure to run.
    mark: GA

  - id: google-cloud
    name: Google Cloud
    url: https://cloud.google.com          # unverified
    page: deployment/google-cloud.md
    blurb: Cloud Run, GKE and Vertex for production scale.
    mark: GC

  # Hosted endpoints -- no install, no local page. Their URLs name a specific model, so each
  # carries `pinned`.
  - id: openrouter
    name: OpenRouter
    url: https://openrouter.ai/google/gemma-4-31b-it:free
    pinned: gemma-4
    blurb: Free hosted 31B through an OpenAI-compatible router.
    mark: OR

  - id: cerebras
    name: Cerebras
    url: https://inference-docs.cerebras.ai/models/gemma-4-31b
    pinned: gemma-4
    blurb: Very high token throughput on Cerebras hardware.
    mark: CB

  - id: ai-studio
    name: Google AI Studio
    short_name: AI Studio
    url: https://aistudio.google.com/prompts/new_chat?model=gemma-4-31b-it
    pinned: gemma-4
    blurb: Try Gemma in the browser, no key or setup.
    mark: AI

  - id: transformers
    name: Hugging Face Transformers
    short_name: Transformers
    url: https://huggingface.co/docs/transformers
    page: deployment/huggingface.md
    blurb: The standard Python path for building and training.
