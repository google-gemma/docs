# Engines, libraries and runtimes the docs show code for -- the single source of truth.
#
# Consumed by:
#   - Frontmatter validation  (scripts/frontmatter_schema.py, the `frameworks` key)
#   - The page context strip  (overrides/partials/model-names.html, generated)
#
# A controlled vocabulary on purpose: "transformers" vs "huggingface" vs "hf" spread across 89
# pages would be unusable. Add an entry here before using it in a page -- the linter rejects
# anything not listed, which is the point.
#
# This list holds only what is in use. It is not a catalogue of everything that can run Gemma.
#
#   id    what frontmatter uses. Lowercase, kebab-case.
#   name  the canonical display name.
#   short_name  optional compact label for dense UI such as the page context strip.
#   url   the project's own home. Where one was already linked from a docs page, that URL is
#         reused verbatim; the four marked `unverified` were not found anywhere in docs/ and
#         should be confirmed before anyone relies on them.
#   page  our page for it, where we have one.
#
# There is deliberately no `category`. The previous version had one and it was incoherent:
# `local`/`serve` classify where something runs while `library`/`tuning`/`orchestration`
# classify what kind of software it is, so `transformers` and `llamacpp` -- both libraries,
# both usually local -- landed in different groups for no reason a reader could follow.

frameworks:
  - id: ollama
    name: Ollama
    url: https://ollama.com
    page: deployment/ollama.md

  - id: llamacpp
    name: llama.cpp
    url: https://github.com/ggml-org/llama.cpp
    page: deployment/llamacpp.md

  - id: lmstudio
    name: LM Studio
    url: https://lmstudio.ai
    page: deployment/lmstudio.md

  - id: mlx
    name: MLX
    url: https://github.com/ml-explore/mlx
    page: deployment/mlx.md

