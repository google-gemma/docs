    url: https://ai.google.dev/edge/litert
    page: deployment/litert.md

  - id: webgpu
    name: WebGPU
    url: https://www.w3.org/TR/webgpu/     # unverified
    page: deployment/web.md

  - id: vllm
    name: vLLM
    url: https://docs.vllm.ai
    page: deployment/vllm.md

  - id: sglang
