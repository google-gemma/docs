# ============================================================================
# Zensical Configuration for Google DeepMind Gemma Documentation
# ============================================================================

[project]

site_name = "Gemma Documentation"
site_description = "Gemma open model documentation by Google DeepMind"
site_author = "Google DeepMind"
site_url = "https://gemma.ai"

copyright = """
Copyright &copy; 2026 Google DeepMind
"""
# Order matters: the token layer must load first, motion last.
extra_css = [
  "stylesheets/gemma.css?v=2",       # tokens: palette, spacing, radius, shadow
  "stylesheets/layout.css?v=2",      # page grid, sidebars, typography scale
  "stylesheets/nav.css?v=2",         # header, tabs, sidebar, table of contents
  "stylesheets/content.css?v=2",     # tables, admonitions, code, tabs
  "stylesheets/components.css?v=2",  # cards, badges, figures, steps, embeds
  "stylesheets/icons.css?v=2",       # inlined icon-set SVGs and card icons
  "stylesheets/engine-grid.css?v=2", # quickstart: the "run it with" engine grid
  "stylesheets/model-tree.css?v=2",  # models overview: the family lineage tree
  "stylesheets/embeds.css?v=2",      # external interactive demos
  "stylesheets/page-context.css?v=2",# the applicability bar above every H1
  "stylesheets/tokens.css?v=2",      # chat-token badges
  "stylesheets/tuning-map.css?v=3",  # interactive fine-tuning pipeline map
  "stylesheets/home.css?v=3",        # landing page: chrome, backdrop, hero
  "stylesheets/llm-tutorial.css",    # interactive "How LLMs work" tutorial widgets
  "stylesheets/llm-animations.css",  # keyframes & motion choreography for LLM tutorial widgets
  "stylesheets/llm-shell.css?v=1",   # interactive tour shell: viewport lock, stage rail, hero
  "stylesheets/llm-stage.css?v=1",   # interactive tour stage: glass stage cards and nav buttons
  "stylesheets/llm-terminal.css?v=1",# interactive tour drawer: bottom reading terminal
  "stylesheets/motion.css?v=2",      # transitions + reduced-motion opt-out
]
# Order matters: the generated data must load before the switcher that reads it.
# All entries use `defer = true` so scripts stay non-render-blocking while preserving execution order.
extra_javascript = [
  { path = "javascripts/model-data.js?v=2", defer = true },     # GENERATED from data/models.yml -- do not edit
  { path = "javascripts/model-switcher.js?v=3", defer = true }, # page context strip selector + code rewriting
  { path = "javascripts/tuning-map.js?v=3", defer = true },     # interactive fine-tuning map & path picker
  { path = "javascripts/llm-tutorial.js", defer = true },       # interactive "How LLMs work" tutorial widgets
  { path = "javascripts/llm-ascii-shell.js?v=1", defer = true },# interactive tour shell: ASCII canvas, stage rail, terminal
  { path = "javascripts/mathjax.js", defer = true },
  { path = "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js", defer = true },
]
# `include_yaml` exposes data/models.yml as `modeldata.*` in page templates. NOT `models.*`:
# every page carries a `models:` frontmatter key, and page metadata shadows a macros variable
# of the same name -- which silently broke both generated tables. See data/models.yml
# for what reads it. Hand-editing a model table in a page is a bug; change the data file.
plugins = { macros = { enabled = true, include_yaml = { modeldata = "data/models.yml", frameworkdata = "data/frameworks.yml" } } }

