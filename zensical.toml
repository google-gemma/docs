# ============================================================================
# Zensical Configuration for Google DeepMind Gemma Documentation
# ============================================================================

[project]

site_name = "Gemma Documentation"
site_description = "Gemma open model documentation by Google DeepMind"
site_author = "Google DeepMind"
site_url = "https://gemma.ai"

copyright = """
Copyright &copy; 2026 Google DeepMind
"""
# Order matters: the token layer must load first, motion last.
extra_css = [
  "stylesheets/gemma.css",       # tokens: palette, spacing, radius, shadow
  "stylesheets/layout.css",      # page grid, sidebars, typography scale
  "stylesheets/nav.css",         # header, tabs, sidebar, table of contents
  "stylesheets/content.css",     # tables, admonitions, code, tabs
  "stylesheets/components.css",  # cards, badges, figures, steps, embeds
  "stylesheets/engine-grid.css", # quickstart: the "run it with" engine grid
  "stylesheets/model-tree.css",  # models overview: the family lineage tree
  "stylesheets/embeds.css",      # external interactive demos
  "stylesheets/page-context.css",# the applicability bar above every H1
  "stylesheets/tokens.css",      # chat-token badges
  "stylesheets/home.css",        # landing page: chrome, backdrop, hero
  "stylesheets/motion.css",      # transitions + reduced-motion opt-out
]
# Order matters: the generated data must load before the switcher that reads it.
extra_javascript = [
  "javascripts/model-data.js",     # GENERATED from data/models.yml -- do not edit
  "javascripts/model-switcher.js", # page context strip selector + code rewriting
]
# `include_yaml` exposes data/models.yml as `modeldata.*` in page templates. NOT `models.*`:
# every page carries a `models:` frontmatter key, and page metadata shadows a macros variable
# of the same name -- which silently broke both generated tables. See data/models.yml
# for what reads it. Hand-editing a model table in a page is a bug; change the data file.
plugins = { macros = { enabled = true, include_yaml = { modeldata = "data/models.yml", frameworkdata = "data/frameworks.yml" } } }

# ============================================================================
# NAVIGATION
# ============================================================================
nav = [
  { "Home" = "index.md" },

  # ---------------------------------------------------------------------------
  # Capabilities live here, not in their own tab: they are fundamental Gemma 4
  # capabilities and belong where the full picture is visible at once.
  # ---------------------------------------------------------------------------
  { "Get started" = [
    { "Quickstart" = "get-started/index.md" },
    { "Best practices" = "get-started/best-practices.md" },
    { "Text" = [
      "get-started/capabilities/text.md",
      "get-started/capabilities/thinking.md",
      "get-started/capabilities/function-calling.md",
    ]},
    { "Multimodal" = [
      "get-started/capabilities/vision.md",
      "get-started/capabilities/image.md",
      "get-started/capabilities/video.md",
      "get-started/capabilities/audio.md",
    ]},
    # Advanced holds the tuning-and-internals material -- MTP, QAT and the
    # prompt-format references -- so the main list stays what a newcomer needs
    # first: how to run it and how to run it well, then the capability groups.
    { "Advanced" = [
      { "Multi-Token Prediction" = "get-started/capabilities/mtp.md" },
      { "Quantization-Aware Training" = "get-started/qat.md" },
      "get-started/prompt-formatting.md",
      { "Prompt structure (Gemma 1-3)" = "get-started/prompt-structure.md" },
    ]},
  ]},

  # ---------------------------------------------------------------------------
  # Model-card centric on purpose. Grouping is presentation only -- the
  # directories stay flat so a model's URL never changes when it is
  # reclassified (see PLAN.md, "Open decision for Step 2.1").
  # ---------------------------------------------------------------------------
  { "Models" = [
    { "Overview" = "models/index.md" },
    { "Gemma 4" = [
      { "Overview" = "models/gemma-4/index.md" },
      { "Model card" = "models/gemma-4/model-card.md" },
    ]},
    { "Variants" = [
      { "Gemma 3n" = [
        { "Overview" = "models/gemma-3n/index.md" },
        { "Model card" = "models/gemma-3n/model-card.md" },
      ]},
      { "DiffusionGemma" = [
        { "Overview" = "models/diffusiongemma/index.md" },
        { "Model card" = "models/diffusiongemma/model-card.md" },
        { "Diffusion explained" = "models/diffusiongemma/explained.md" },
        { "Generate output" = "models/diffusiongemma/inference.md" },
      ]},
      { "FunctionGemma" = [
        { "Overview" = "models/functiongemma/index.md" },
        { "Model card" = "models/functiongemma/model-card.md" },
        { "Formatting and best practices" = "models/functiongemma/formatting.md" },
        { "Function calling with HF" = "models/functiongemma/inference.md" },
        { "Full sequence" = "models/functiongemma/full-sequence.md" },
        { "Fine-tuning" = "models/functiongemma/fine-tuning.md" },
      ]},
      { "EmbeddingGemma" = [
        { "Overview" = "models/embeddinggemma/index.md" },
        { "Model card" = "models/embeddinggemma/model-card.md" },
        { "Generate embeddings" = "models/embeddinggemma/inference.md" },
        { "Fine-tuning" = "models/embeddinggemma/fine-tuning.md" },
      ]},
      { "PaliGemma" = [
        { "Overview" = "models/paligemma/index.md" },
        { "PaliGemma 1 model card" = "models/paligemma/model-card-v1.md" },
        { "PaliGemma 2 model card" = "models/paligemma/model-card-v2.md" },
        { "Prompting & system instructions" = "models/paligemma/prompting.md" },
        { "Generate output with Keras" = "models/paligemma/inference.md" },
        { "Fine-tuning with JAX" = "models/paligemma/fine-tuning.md" },
      ]},
      { "ShieldGemma" = [
        { "Overview" = "models/shieldgemma/index.md" },
        { "ShieldGemma model card" = "models/shieldgemma/model-card-v1.md" },
        { "ShieldGemma 2 model card" = "models/shieldgemma/model-card-v2.md" },
      ]},
    ]},
    { "Previous generations" = [
      { "Gemma 3" = "models/gemma-3/index.md" },
      { "Gemma 2" = "models/gemma-2/index.md" },
      { "Gemma" = "models/gemma-1/index.md" },
    ]},
    { "Research" = [
      { "RecurrentGemma" = [
