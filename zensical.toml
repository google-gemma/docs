# ============================================================================
# FOOTER
# ============================================================================
# Rendered by the theme's footer as icon links. Every icon below ships with
# Zensical (.icons/fontawesome/brands/), so none of these need a vendored SVG.

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/googlegemma"
name = "Gemma on X"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/google-gemma"
name = "Gemma on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/hugging-face"
link = "https://huggingface.co/collections/google/gemma-4"
name = "Gemma 4 on Hugging Face"

[[project.extra.social]]
icon = "fontawesome/brands/kaggle"
link = "https://www.kaggle.com/models/google/gemma-4"
name = "Gemma 4 on Kaggle"

# ============================================================================
# ANALYTICS & CONSENT
# ============================================================================
# Google Analytics 4 (GA4) Measurement ID. Can also be overridden at build time
# via the GA_MEASUREMENT_ID environment variable in scripts/build_docs.py.
[project.extra.analytics]
provider = "google"
property = "G-CWMC2KTTGQ"

[project.extra.consent]
title = "Cookie consent"
description = """
We use cookies to recognize your repeated visits and preferences, as well as to measure the effectiveness of our documentation and whether users find what they're searching for. With your consent, you're helping us to make our documentation better.
"""
actions = ["accept", "reject", "manage"]

[project.extra.consent.cookies]
analytics = "Google Analytics"

# ============================================================================
# THEME
# ============================================================================
[project.theme]

logo = "assets/icon-one-color.png"
favicon = "assets/icon.png"
custom_dir = "overrides"
language = "en"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ============================================================================
# MARKDOWN EXTENSIONS
# ============================================================================
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
# Shared reference-link and glossary definitions, generated into snippets/ from
# data/links.yml and data/glossary.yml. links.md is appended to every page because a reference
# definition renders as nothing; glossary.md is opt-in per page, since `abbr` marks up every
# occurrence of a term and a global glossary would be noise.
[project.markdown_extensions.pymdownx.snippets]
base_path = ["snippets"]
auto_append = ["links.md"]
check_paths = true

[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
