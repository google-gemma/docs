    { "Visual guides" = [
      { "Gemma 4" = "tutorials/visual-guides/gemma-4.md" },
      { "Gemma 4 12B" = "tutorials/visual-guides/gemma-4-12b.md" },
      { "Multi-Token Prediction" = "tutorials/visual-guides/mtp.md" },
      { "DiffusionGemma" = "tutorials/visual-guides/diffusiongemma.md" },
    ]},
    { "Tutorials" = [
      "learn/business-email-assistant.md",
      "learn/personal-code-assistant.md",
    ]},
    { "Notebooks & resources" = "cookbook.md" },
  ]},

  # ---------------------------------------------------------------------------
  # Absorbs the old Tools tab: things we built, plus things we embed.
  # ---------------------------------------------------------------------------
  { "Demos" = [
    { "Interactive tools" = [
      { "Overview" = "tools/index.md" },
