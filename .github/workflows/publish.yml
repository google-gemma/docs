name: Publish

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source branch name"
        required: true
        type: string
      commit_message:
        description: "Commit message"
        required: true
        type: string
      dry_run:
        description: "Validate everything without pushing or closing the PR"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "docs,${{ github.event.repository.name }}"
          permission-contents: write
          permission-pull-requests: write

      - name: Verify approval and push squashed commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          ACTOR_LOGIN: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          fail() {
            printf '::error::%s\n' "$1"
            exit 1
          }

          [[ "${SOURCE_REPO}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && "${SOURCE_REPO}" != "google-gemma/docs" ]] || \
            fail "Invalid source repository '${SOURCE_REPO}' (must be an owner/repo other than google-gemma/docs)."
          [[ "${SOURCE_BRANCH}" != "main" && "${SOURCE_BRANCH}" =~ ^[A-Za-z0-9_./-]+$ ]] || \
            fail "Invalid source branch '${SOURCE_BRANCH}' (cannot be 'main' and must match ^[A-Za-z0-9_./-]+$)."
          git check-ref-format --branch "${SOURCE_BRANCH}" >/dev/null || \
            fail "Source branch '${SOURCE_BRANCH}' is not a valid git branch name."
          [[ -n "${COMMIT_MESSAGE// /}" ]] || \
            fail "Commit message must not be empty or whitespace-only."

          git init repo && cd repo
          AUTH_B64="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git config "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${AUTH_B64}"
          git remote add upstream https://github.com/google-gemma/docs.git
          git remote add origin "https://github.com/${SOURCE_REPO}.git"
          git fetch --no-tags upstream main || \
            fail "Failed to fetch 'main' from upstream (google-gemma/docs)."
          git fetch --no-tags origin "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/target" || \
            fail "Failed to fetch branch '${SOURCE_BRANCH}' from origin (${SOURCE_REPO})."
          UPSTREAM_SHA="$(git rev-parse refs/remotes/upstream/main)"
          TARGET_SHA="$(git rev-parse refs/remotes/origin/target)"
          git merge-base --is-ancestor "${UPSTREAM_SHA}" "${TARGET_SHA}" || \
            fail "Branch '${SOURCE_BRANCH}' (${TARGET_SHA}) is behind upstream main (${UPSTREAM_SHA}). Merge or rebase main into '${SOURCE_BRANCH}' before publishing."
          [[ "$(git rev-parse "${TARGET_SHA}^{tree}")" != "$(git rev-parse "${UPSTREAM_SHA}^{tree}")" ]] || \
            fail "Branch '${SOURCE_BRANCH}' (${TARGET_SHA}) has no tree differences compared to upstream main (${UPSTREAM_SHA})."

          BLOCKED_FILES="$(git diff --no-renames --name-only "${UPSTREAM_SHA}" "${TARGET_SHA}" -- .github/workflows .github/agents)"
          [[ -z "${BLOCKED_FILES}" ]] || \
            fail "Branch '${SOURCE_BRANCH}' modifies paths blocked for Publish (.github/workflows or .github/agents): $(printf '%s' "${BLOCKED_FILES}" | tr '\n' ' '). Open a direct PR on google-gemma/docs for those changes."

          MAX_FILE_BYTES=52428800
          while IFS= read -r -d '' path; do
            [[ "$(git cat-file -t "${TARGET_SHA}:${path}" 2>/dev/null || true)" == "blob" ]] || continue
            size="$(git cat-file -s "${TARGET_SHA}:${path}")"
            (( size <= MAX_FILE_BYTES )) || \
              fail "File '${path}' is ${size} bytes (exceeds ${MAX_FILE_BYTES} byte Publish limit; GitHub rejects pushes over 100 MB)."
          done < <(git diff --no-renames --name-only --diff-filter=ACMR -z "${UPSTREAM_SHA}" "${TARGET_SHA}")

          PR_JSON="$(gh api -X GET "repos/${SOURCE_REPO}/pulls" -f state=open -f base=main -f "head=${REPO_OWNER}:${SOURCE_BRANCH}")"
          PR_NUMBER="$(printf '%s' "${PR_JSON}" | jq -r '.[0].number // empty')"
          PR_AUTHOR="$(printf '%s' "${PR_JSON}" | jq -r '.[0].user.login // empty')"
          PR_HEAD="$(printf '%s' "${PR_JSON}" | jq -r '.[0].head.sha // empty')"
          [[ -n "${PR_NUMBER}" ]] || \
            fail "No open pull request found from '${REPO_OWNER}:${SOURCE_BRANCH}' into 'main' in ${SOURCE_REPO}."
          [[ "${PR_HEAD}" == "${TARGET_SHA}" ]] || \
            fail "Open PR #${PR_NUMBER} head SHA (${PR_HEAD}) does not match branch '${SOURCE_BRANCH}' (${TARGET_SHA})."

          REVIEWS_JSON="$(gh api --paginate --slurp "repos/${SOURCE_REPO}/pulls/${PR_NUMBER}/reviews?per_page=100")"
          APPROVERS="$(printf '%s' "${REVIEWS_JSON}" | jq -r --arg a "${PR_AUTHOR}" \
            'flatten | map(select(.user.login != null and .user.login != $a and (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED"))) | group_by(.user.login) | map(sort_by(.id) | last) | .[] | select(.state == "APPROVED") | .user.login')"
          VALID_LGTM=0
          for reviewer in ${APPROVERS}; do
            perm="$(gh api "repos/${SOURCE_REPO}/collaborators/${reviewer}/permission" --jq '.permission')"
            case "${perm}" in admin|maintain|write) VALID_LGTM=1; break ;; esac
          done
          [[ "${VALID_LGTM}" -ge 1 ]] || \
            fail "PR #${PR_NUMBER} has no valid approving review from a non-author collaborator with admin, maintain, or write permission."

          export GIT_AUTHOR_NAME="${ACTOR_LOGIN}"
          export GIT_AUTHOR_EMAIL="${ACTOR_ID}+${ACTOR_LOGIN}@users.noreply.github.com"
          export GIT_COMMITTER_NAME="${GIT_AUTHOR_NAME}"
          export GIT_COMMITTER_EMAIL="${GIT_AUTHOR_EMAIL}"
          SQUASH_SHA="$(git commit-tree "${TARGET_SHA}^{tree}" -p "${UPSTREAM_SHA}" -m "${COMMIT_MESSAGE}")"
          if [[ "${DRY_RUN}" == "true" ]]; then
            printf '::notice::Dry run passed for PR #%s (%s -> %s). Built squash commit %s; skipped pushing and closing PR.\n' \
              "${PR_NUMBER}" "${SOURCE_BRANCH}" "${UPSTREAM_SHA:0:7}" "${SQUASH_SHA:0:7}"
            exit 0
          fi
          git push upstream "${SQUASH_SHA}:refs/heads/main"
          git push origin "${SQUASH_SHA}:refs/heads/main"
          gh api -X PATCH "repos/${SOURCE_REPO}/pulls/${PR_NUMBER}" -f state=closed
