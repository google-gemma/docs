name: Sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "docs,${{ github.event.repository.name }}"
          permission-contents: write
          permission-workflows: write

      - name: Fast-forward main
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "${TARGET_REPO}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && "${TARGET_REPO}" != "google-gemma/docs" ]]
          git init repo && cd repo
          AUTH_B64="$(printf 'x-access-token:%s' "${GH_APP_TOKEN}" | base64 -w0)"
          git config "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${AUTH_B64}"
          git fetch --no-tags https://github.com/google-gemma/docs.git main:refs/remotes/upstream/main
          git push "https://github.com/${TARGET_REPO}.git" refs/remotes/upstream/main:refs/heads/main --ff-only
