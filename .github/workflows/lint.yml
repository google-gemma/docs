name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: these jobs only read the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (org policy: zizmor unpinned-uses).
      # Update a pin by resolving the tag, e.g.:
      #   gh api repos/actions/checkout/git/ref/tags/v7 --jq '.object.sha'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Script tests
        run: uv run --frozen python -m unittest discover -s tests -p "test_*.py"

      - name: Lint documentation
        run: uv run --frozen python scripts/lint_docs.py --baseline

      - name: Build documentation
        env:
          GA_MEASUREMENT_ID: ""
        run: uv run --frozen python scripts/build_docs.py

      # Advisory: shows the full Phase 0 backlog without affecting the job result.
      - name: Backlog (informational)
        if: always()
        run: uv run --frozen python scripts/lint_docs.py || true
