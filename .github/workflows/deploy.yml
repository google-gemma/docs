name: Deploy Gemma Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege at the workflow level; the deploy job widens this for itself.
# Granting pages/id-token here would hand them to the build job too, which only needs to read.
permissions:
  contents: read

# Only allow one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (org policy: zizmor unpinned-uses).
      # Update a pin by resolving the tag, e.g.:
      #   gh api repos/actions/checkout/git/ref/tags/v7 --jq '.object.sha'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10

      - name: Script tests
        run: uv run --frozen python -m unittest discover -s tests -p "test_*.py"

      - name: Lint docs
        run: uv run --frozen python scripts/lint_docs.py --baseline

      - name: Build docs
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || secrets.GA_MEASUREMENT_ID || 'G-CWMC2KTTGQ' }}
        run: |
          uv run --frozen python scripts/build_docs.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Scoped to this job only -- these are what actions/deploy-pages needs.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
